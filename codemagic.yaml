workflows:
  ios-sideloadly:
    name: iOS Build for Sideloadly (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Clear SPM cache
        script: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts/ || true
      - name: Pod install
        script: cd ios && pod install
      - name: Build unsigned IPA
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
